name: Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Do NOT cancel in-progress main runs: a run cancelled after `release` has
  # tagged a version but before `publish` uploads the provider zips, SHA256SUMS
  # and signature leaves a tagged registry version with missing/partial assets,
  # breaking `terraform init` for that version.
  # Queued runs still coalesce; only pr.yaml may cancel in progress.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  go-lint:
    name: Go Lint
    uses: ./.github/workflows/go-lint.yaml

  action-lint:
    name: Action Lint
    uses: ./.github/workflows/action-lint.yaml

  unit-tests:
    name: Unit Tests
    needs:
      - go-lint
      - action-lint
    uses: ./.github/workflows/unit-tests.yaml

  gosec:
    name: Go Security
    needs:
      - unit-tests
    uses: ./.github/workflows/gosec.yaml

  build:
    name: Build
    needs:
      - gosec
    uses: ./.github/workflows/build.yaml

  release:
    name: Release
    needs:
      - build
    uses: kupecloud/github-workflows/.github/workflows/semantic-release.yaml@75f2bc349709d9fec6630dbd937301d1a32708e0 # v1.1.0
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
      id-token: write
    secrets: inherit

  publish:
    name: Publish
    needs:
      - release
    if: needs.release.outputs.new_release_published == 'true'
    uses: ./.github/workflows/publish.yaml
    permissions:
      contents: write
    with:
      version: ${{ needs.release.outputs.new_release_version }}
    secrets: inherit
