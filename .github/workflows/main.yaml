name: Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Do NOT cancel in-progress main runs: a run cancelled after `release` has
  # tagged a version but before `publish` uploads the provider zips, SHA256SUMS
  # and signature leaves a tagged registry version with missing/partial assets,
  # breaking `terraform init` for that version.
  # Queued runs still coalesce; only pr.yaml may cancel in progress.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Every check the PR runs, once more on the merged tree. There is no branch
  # protection, so this is the only guarantee that a released tree passed.
  gates:
    name: Gates
    uses: ./.github/workflows/gates.yaml
    with:
      pre-commit-args: --all-files --show-diff-on-failure --hook-stage manual
      # govulncheck runs weekly in security.yaml.
      skip: govulncheck

  release:
    name: Release
    needs:
      - gates
    # Inline copy of github-workflows semantic-release.yaml v2.5.2: this public
    # repository cannot call the private github-workflows.
    uses: ./.github/workflows/semantic-release.yaml
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
      id-token: write
    secrets: inherit

  publish:
    name: Publish
    needs:
      - release
    if: needs.release.outputs.new_release_published == 'true'
    uses: ./.github/workflows/publish.yaml
    permissions:
      contents: write
    with:
      version: ${{ needs.release.outputs.new_release_version }}
    secrets: inherit
