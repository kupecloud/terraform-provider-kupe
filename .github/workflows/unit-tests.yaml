name: Unit Tests

# terraform-plugin-testing runs the acceptance tests against a real
# Terraform/OpenTofu CLI. Without TF_ACC_TERRAFORM_PATH it falls back to
# downloading Terraform via hc-install and verifying its GPG signature —
# that download breaks when HashiCorp's embedded signing key expires. We
# install OpenTofu up-front and let the framework use that binary.
#
# TODO: migrate this back to kupecloud/github-workflows/go-unit-tests.yaml
# once that workflow gains a `setup-opentofu` input. The test-summary and
# go-mod-tidy logic below is duplicated from there; keep them in sync.

on:
  workflow_call:

jobs:
  unit-tests:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_wrapper: false

      - name: Run go vet
        id: govet
        run: go vet ./...

      - name: Run unit tests
        id: unit
        env:
          TF_ACC_PROVIDER_HOST: registry.opentofu.org
          TF_ACC_PROVIDER_NAMESPACE: kupecloud
        shell: bash
        run: |
          set -o pipefail
          TF_ACC_TERRAFORM_PATH="$(command -v tofu)"
          export TF_ACC_TERRAFORM_PATH
          go test -json -race -coverprofile=coverage.out ./... | tee unit-tests.json

      - name: Unit test summary
        if: always()
        shell: bash
        run: |
          if [ -f unit-tests.json ]; then
            pass=$(awk -F'"' '/"Action":"pass"/ && /"Test":/ {count++} END {print count+0}' unit-tests.json)
            fail=$(awk -F'"' '/"Action":"fail"/ && /"Test":/ {count++} END {print count+0}' unit-tests.json)
            skip=$(awk -F'"' '/"Action":"skip"/ && /"Test":/ {count++} END {print count+0}' unit-tests.json)
          else
            pass=0
            fail=0
            skip=0
          fi
          total=$((pass + fail + skip))
          coverage="n/a"
          if [ -f coverage.out ]; then
            coverage=$(go tool cover -func=coverage.out | awk 'END {print $3}')
          fi
          {
            echo "### Unit tests"
            echo ""
            echo "| Metric | Count |"
            echo "| --- | --- |"
            echo "| Total | ${total} |"
            echo "| Passed | ${pass} |"
            echo "| Failed | ${fail} |"
            echo "| Skipped | ${skip} |"
            echo "| Coverage | ${coverage} |"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| go vet | ${{ steps.govet.outcome }} |"
            echo "| go test | ${{ steps.unit.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always() && hashFiles('coverage.out') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  go-mod-tidy:
    name: Check go mod tidy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check go mod tidy
        shell: bash
        run: |
          set -euo pipefail

          before_dir="$(mktemp -d)"
          trap 'rm -rf "$before_dir"' EXIT

          for file in go.mod go.sum; do
            if [ -f "$file" ]; then
              cp "$file" "$before_dir/$file"
            fi
          done

          go mod tidy

          changed=0
          for file in go.mod go.sum; do
            before_file="$before_dir/$file"
            if [ -f "$before_file" ] && [ -f "$file" ]; then
              if ! cmp -s "$before_file" "$file"; then
                changed=1
                break
              fi
              continue
            fi
            if [ -f "$before_file" ] || [ -f "$file" ]; then
              changed=1
              break
            fi
          done

          if [ "$changed" -eq 1 ]; then
            echo "go.mod or go.sum is not tidy. Run 'go mod tidy' and commit the changes."
            exit 1
          fi
