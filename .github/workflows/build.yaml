name: Build

on:
  workflow_call:

jobs:
  build:
    name: Build and Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_wrapper: false

      - name: Install tfplugindocs
        run: make docs-install

      - name: Build provider
        run: make build

      - name: Validate OpenTofu examples
        run: make tofu-validate

      - name: Generate provider docs
        run: make docs-generate

      - name: Check generated docs are committed
        run: |
          if ! git diff --exit-code -- docs/; then
            echo "::error::Committed docs/ is out of date with the provider schema."
            echo "Run 'make docs-generate' locally and commit the result."
            exit 1
          fi

      - name: Validate provider docs
        run: make docs-validate
